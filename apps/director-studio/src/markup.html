<div class="shell">
  <header class="topbar">
    <div class="brand">VisionWeaver Studio<small>Crossroads of Identity · Book 1 Convergence · Episode 1 "The News"</small></div>
    <div class="search" id="searchWrap"><input id="q" type="text" placeholder="Find a shot, task ID, cue, still…  ( / )" autocomplete="off" aria-label="Search the production"><div class="results" id="results" hidden></div></div>
    <div class="topstats">
      <div class="stat credits"><b class="num">36,738</b><span>Runway credits · live 9/29</span></div>
      <div class="stat"><b class="num" id="st-parts">1 of 5</b><span>Parts finished</span></div>
      <div class="stat"><b class="num" id="st-you">0</b><span>Waiting on Sire</span></div>
      <span class="mode" id="mode"><i></i><span>This browser only</span></span>
      <button class="btn small" id="themeBtn" type="button" aria-label="Switch light or dark">Light / Dark</button>
    </div>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Pipeline stages"></nav>
    <main id="main"></main>
  </div>
</div>
<button type="button" class="btn primary askbtn" id="askOpen" hidden>Ask the studio</button>
<aside class="drawer" id="drawer" hidden aria-label="Ask the studio">
  <header><b>Ask the studio</b><span class="note" style="flex:1">Knows this episode's records</span><button type="button" class="btn small" id="askClose">Close</button></header>
  <div class="chat" id="chat"></div>
  <form id="askForm">
    <div class="chips" id="askChips"></div>
    <textarea id="askIn" rows="3" placeholder="Ask about a shot, a cost, what's next…"></textarea>
    <div class="row"><button type="submit" class="btn primary" id="askSend">Ask</button><button type="button" class="btn" id="askStop" hidden>Stop</button><span class="note">Answers use your Claude usage.</span></div>
  </form>
</aside>
<div class="toast" id="toast" hidden></div>
